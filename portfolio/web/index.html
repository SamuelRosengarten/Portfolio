<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!--
    Without this, mobile Safari renders the page at a default desktop-width
    viewport (~980px) and scales it down to fit the screen, so Flutter's
    MediaQuery width never reflects the phone's real logical width — the
    site's phone-size nav drawer breakpoint (< 600px) then never trips on a
    real device, even though it works fine when a desktop browser window is
    resized narrow.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>portfolio</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The site's sections (Hobbies especially) are laid out for a phone's tall
    portrait aspect ratio. Turned sideways, a phone's viewport gets so short
    that the same layout has almost no vertical room to work with and looks
    cramped rather than redesigning itself. Flutter's own orientation-lock
    API (SystemChrome.setPreferredOrientations) only works on native
    Android/iOS, not a page running in a mobile browser like this one, so
    the lock has to happen here instead: hide the app behind a "please
    rotate back" message whenever a short-height landscape viewport shows up
    (a phone laid down), while leaving wider/taller landscape — tablets,
    or a desktop browser window — untouched.
  -->
  <style>
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0b0b0d;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #rotate-overlay svg {
      width: 48px;
      height: 48px;
      animation: rotate-hint 1.6s ease-in-out infinite;
    }
    #rotate-overlay p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      max-width: 260px;
    }
    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
    @media screen and (orientation: landscape) and (max-height: 500px) {
      #rotate-overlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="6" y="3" width="12" height="18" rx="2"></rect>
      <line x1="10" y1="19" x2="14" y2="19"></line>
    </svg>
    <p>This site is designed for portrait mode. Please rotate your device back.</p>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
