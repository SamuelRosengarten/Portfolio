<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Samuel Rosengarten's portfolio — a computer programming student at Cégep Édouard-Montpetit, building software after a background in welding and mechanics. Projects in Flutter, Dart, and Kotlin.">

  <!-- Open Graph / social link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Samuel Rosengarten">
  <meta property="og:title" content="Samuel Rosengarten — Portfolio">
  <meta property="og:description" content="Computer programming student at Cégep Édouard-Montpetit, building software after a background in welding and mechanics.">
  <meta property="og:url" content="https://samuelrosengarten.github.io/Portfolio/">
  <meta property="og:image" content="https://samuelrosengarten.github.io/Portfolio/social-banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Samuel Rosengarten — Portfolio">
  <meta name="twitter:description" content="Computer programming student at Cégep Édouard-Montpetit, building software after a background in welding and mechanics.">
  <meta name="twitter:image" content="https://samuelrosengarten.github.io/Portfolio/social-banner.png">

  <!-- Structured data: lets search engines show a richer result (name,
       role, profile links) instead of a plain blue link. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Samuel Rosengarten",
    "url": "https://samuelrosengarten.github.io/Portfolio/",
    "image": "https://samuelrosengarten.github.io/Portfolio/social-banner.png",
    "jobTitle": "Computer Programming Student",
    "description": "Computer programming student at Cégep Édouard-Montpetit, building software after a background in welding and mechanics.",
    "email": "mailto:samrosengarten2@pm.me",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Longueuil",
      "addressRegion": "QC",
      "addressCountry": "CA"
    },
    "sameAs": [
      "https://github.com/SamuelRosengarten",
      "https://linkedin.com/in/samuel-rosengarten-63b932404"
    ]
  }
  </script>
  <!--
    Without this, mobile Safari renders the page at a default desktop-width
    viewport (~980px) and scales it down to fit the screen, so Flutter's
    MediaQuery width never reflects the phone's real logical width — the
    site's phone-size nav drawer breakpoint (< 600px) then never trips on a
    real device, even though it works fine when a desktop browser window is
    resized narrow.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Samuel Rosengarten — Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The site's sections (Hobbies especially) are laid out for a phone's tall
    portrait aspect ratio. Turned sideways, a phone's viewport gets so short
    that the same layout has almost no vertical room to work with and looks
    cramped rather than redesigning itself. Flutter's own orientation-lock
    API (SystemChrome.setPreferredOrientations) only works on native
    Android/iOS, not a page running in a mobile browser like this one, so
    the lock has to happen here instead: hide the app behind a "please
    rotate back" message whenever a short-height landscape viewport shows up
    (a phone laid down), while leaving wider/taller landscape — tablets,
    or a desktop browser window — untouched.
  -->
  <style>
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0b0b0d;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #rotate-overlay svg {
      width: 48px;
      height: 48px;
      animation: rotate-hint 1.6s ease-in-out infinite;
    }
    #rotate-overlay p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      max-width: 260px;
    }
    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
    @media screen and (orientation: landscape) and (max-height: 500px) {
      #rotate-overlay { display: flex; }
    }

    /*
      Flutter web has nothing to paint until its engine (CanvasKit/Wasm) has
      downloaded and booted, which can take a beat on a slow connection —
      without this, that gap is just a blank page. #app-loading fills the
      same near-black the site opens in by default (ThemeController defaults
      to dark mode) so there's no flash, and script below removes it the
      moment Flutter dispatches "flutter-first-frame".
    */
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    #app-loading .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #2997FF;
      animation: app-loading-spin 0.8s linear infinite;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="6" y="3" width="12" height="18" rx="2"></rect>
      <line x1="10" y1="19" x2="14" y2="19"></line>
    </svg>
    <p>This site is designed for portrait mode. Please rotate your device back.</p>
  </div>

  <div id="app-loading"><div class="spinner"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
